  <path d="M88 30 L90 35 L95 37 L90 39 L88 44 L86 39 L81 37 L86 35 Z" fill="#fdfbf7"/>
  <path d="M88 30 L90 35 L95 37 L90 39 L88 44 L86 39 L81 37 L86 35 Z" fill="#f3cfa1" opacity="0.5"/>
