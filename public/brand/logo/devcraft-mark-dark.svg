<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dFacetTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe9cc"/>
      <stop offset="100%" stop-color="#f3cfa1"/>
    </linearGradient>
    <linearGradient id="dFacetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e7a977"/>
      <stop offset="100%" stop-color="#c98952"/>
    </linearGradient>
    <linearGradient id="dFacetRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9c6a3f"/>
      <stop offset="100%" stop-color="#6b4226"/>
    </linearGradient>
    <linearGradient id="dRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3cfa1"/>
      <stop offset="100%" stop-color="#e7a977"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.91  0 0 0 0 0.66  0 0 0 0 0.47  0 0 0 0.55 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dDropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <clipPath id="dRingClip">
      <circle cx="60" cy="60" r="52"/>
    </clipPath>
  </defs>

  <circle cx="60" cy="60" r="56" fill="none" stroke="url(#dRingGrad)" stroke-width="3"/>
  <circle cx="60" cy="60" r="52" fill="#110f0c"/>

  <g filter="url(#glow)">
    <g filter="url(#dDropShadow)" clip-path="url(#dRingClip)">
      <path d="M60 25 L85 43 L60 57 L35 43 Z" fill="url(#dFacetTop)"/>
      <path d="M35 43 L60 57 L60 95 L35 69 Z" fill="url(#dFacetLeft)"/>
      <path d="M85 43 L60 57 L60 95 L85 69 Z" fill="url(#dFacetRight)"/>

      <path d="M54.5 51.5 L66 61.5 L54.5 71.5" fill="none" stroke="#1a0f08" stroke-width="6"
